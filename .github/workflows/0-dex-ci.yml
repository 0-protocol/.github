name: 0-dex CI

on:
  push:
    paths: ['0-dex/**']
  pull_request:
    paths: ['0-dex/**']

defaults:
  run:
    working-directory: 0-dex

jobs:
  rust:
    name: Rust lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 0-dex
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets

  solidity:
    name: Foundry contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge tests
        run: forge test -vvv
        working-directory: 0-dex

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ./python[test] pytest
      - name: Run tests
        run: pytest python/tests/ -v
